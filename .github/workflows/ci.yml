name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode and show versions
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version || true
          swift --version
          sw_vers

      - name: Lint Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Run unit tests
        run: make test

      - name: "Build .app (universal: arm64 + x86_64)"
        run: make universal

      - name: Verify code signature
        run: codesign --verify --deep --strict build/MacUnblock.app

      - name: Verify universal binary
        run: |
          archs="$(lipo -archs build/MacUnblock.app/Contents/MacOS/MacUnblock)"
          echo "archs: ${archs}"
          echo "${archs}" | grep -q arm64
          echo "${archs}" | grep -q x86_64

      - name: Verify localizations are bundled
        run: |
          set -e
          for lang in en zh-Hans; do
            test -f "build/MacUnblock.app/Contents/Resources/${lang}.lproj/Localizable.strings"
            echo "ok: ${lang}"
          done
